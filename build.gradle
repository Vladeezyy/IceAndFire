plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id

base {
    archivesName = 'iceandfire-neoforge'
}

repositories {
    mavenLocal() { content { includeGroup 'dev.vladeezyy.rampart' } } // Rampart: ./gradlew publishToMavenLocal there
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven { url = 'https://maven.blamejared.com/' } // JEI
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Functional self-test and client scene (src/selftest): loaded in dev runs only, never part of the jar
sourceSets {
    selftest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    selftestImplementation.extendsFrom implementation
    selftestCompileOnly.extendsFrom compileOnly
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // tools/selftest.sh: functional checks on a fresh world, then the server stops
        selftest {
            server()
            programArgument '--nogui'
            systemProperty 'iceandfire.selftest', 'true'
        }
        // tools/stresstest.sh: generation, 30 dragons and 100 creatures, chunk reload cycles
        stress {
            server()
            programArgument '--nogui'
            systemProperty 'iceandfire.stress', 'true'
        }
        // tools/scenetest.sh: client scene with checks and screenshots in run/screenshots
        scene {
            client()
            systemProperty 'iceandfire.scene', 'true'
        }
        // tools/nettest.sh: a dedicated server in run-netserver and a client that joins it and rides a dragon
        netserver {
            server()
            gameDirectory = project.file('run-netserver')
            programArgument '--nogui'
            systemProperty 'iceandfire.nettest', 'server'
        }
        netclient {
            client()
            systemProperty 'iceandfire.nettest', 'client'
            programArguments.addAll '--quickPlayMultiplayer', 'localhost:25570', '--username', 'NetTester'
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.selftest)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "dev.vladeezyy.rampart:rampart-neoforge:${rampart_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // tools/scenetest.sh -Pwith_compat: the client mods this one is played with (dev only, not in the jar)
    if (project.hasProperty('with_compat')) {
        localRuntime "maven.modrinth:sodium:mc1.21.1-0.6.13-neoforge"
        localRuntime "maven.modrinth:iris:1.8.12+1.21.1-neoforge"
        localRuntime "maven.modrinth:lithium:mc1.21.1-0.15.4-neoforge"
        localRuntime "maven.modrinth:ferrite-core:7.0.3-neoforge"
        localRuntime "maven.modrinth:modernfix:5.27.26+mc1.21.1"
        localRuntime "maven.modrinth:jade:15.10.6+neoforge"
        localRuntime "maven.modrinth:entityculling:8w8FfUPs"
        localRuntime "maven.modrinth:attributefix:TyNITLDY"
        localRuntime "maven.modrinth:bookshelf-lib:1sdJl7J1"
        localRuntime "maven.modrinth:prickle:EE1FHDyD"
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            rampart_version_range  : rampart_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
neoForge.addModdingDependenciesTo(sourceSets.selftest)

tasks.named('jar', Jar).configure {
    from('LICENSE') { rename { 'LICENSE_iceandfire' } }
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '100000']
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
