plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net'
    }
    maven { url = 'https://maven.blamejared.com/' } // JEI
    mavenLocal() { content { includeGroup 'dev.vladeezyy.rampart' } } // Rampart: ./gradlew publishToMavenLocal there
}

// Tests: the shared checks (common/src/selftest) and the Fabric wiring (src/selftest), a second mod in dev runs only
sourceSets {
    selftest {
        java.srcDir rootProject.file('common/src/selftest/java')
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation "dev.vladeezyy.rampart:rampart-fabric:${rampart_version}"
    // tools/scenetest.sh -Pwith_compat: the client and performance mods this one is played with (dev runs only)
    if (project.hasProperty('with_compat')) {
        project.properties.findAll { it.key.startsWith('compat_fabric_') }.each { k, v ->
            runtimeOnly "maven.modrinth:${k.substring('compat_fabric_'.length()).replace('_', '-')}:${v}"
        }
        // the jars these mods carry inside (Iris's shader libraries, EntityCulling's TRansition): Loom does not load nested
        // jars in dev, so they are unpacked next to the build; Fabric API's own modules are left out (no duplicates)
        def nested = layout.buildDirectory.dir('compat-nested').get().asFile
        def compatMods = configurations.detachedConfiguration(*project.properties.findAll { it.key.startsWith('compat_fabric_') }.collect { k, v ->
            dependencies.create("maven.modrinth:${k.substring('compat_fabric_'.length()).replace('_', '-')}:${v}")
        })
        compatMods.transitive = false
        compatMods.files.each { jar ->
            copy {
                from(zipTree(jar)) { include 'META-INF/jars/*.jar'; exclude 'META-INF/jars/fabric-*' }
                eachFile { path = name }
                includeEmptyDirs = false
                into nested
            }
        }
        runtimeOnly fileTree(nested) { include '*.jar' }
    }
    // JEI common API (Mojang names, compile only)
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.0'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.5.0'
}

loom {
    accessWidenerPath = file('src/main/resources/iceandfire.accesswidener')
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        iceandfire_selftest {
            sourceSet sourceSets.selftest
        }
    }
    runs {
        client {
            client()
            runDir('run')
        }
        server {
            server()
            runDir('run')
        }
        // tools/selftest.sh LOADER=fabric
        selftest {
            server()
            name 'Self Test'
            source sourceSets.selftest
            vmArg '-Diceandfire.selftest=true'
            runDir('run')
        }
        // tools/stresstest.sh LOADER=fabric
        stress {
            server()
            name 'Stress'
            source sourceSets.selftest
            vmArg '-Diceandfire.stress=true'
            runDir('run')
        }
        // tools/scenetest.sh LOADER=fabric
        scene {
            client()
            name 'Scene'
            source sourceSets.selftest
            vmArg '-Diceandfire.scene=true'
            runDir('run')
        }
        // tools/nettest.sh LOADER=fabric
        netserver {
            server()
            name 'Net Server'
            source sourceSets.selftest
            vmArg '-Diceandfire.nettest=server'
            runDir('run-netserver')
        }
        netclient {
            client()
            name 'Net Client'
            source sourceSets.selftest
            vmArg '-Diceandfire.nettest=client'
            programArgs '--quickPlayMultiplayer', 'localhost:25570', '--username', 'NetTester'
            runDir('run')
        }
    }
}

tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xmaxerrs', '10000'] }
