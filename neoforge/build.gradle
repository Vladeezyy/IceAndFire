plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

// Tests (src/selftest here and the shared checks in common/src/selftest): dev runs only, never in the jar
sourceSets {
    selftest {
        java.srcDir rootProject.file('common/src/selftest/java')
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    selftestImplementation.extendsFrom implementation
    selftestCompileOnly.extendsFrom compileOnly
}

neoForge {
    // -Pneo_version=21.1.197 checks the oldest supported NeoForge
    version = project.findProperty('neo_version')

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        configureEach {
            gameDirectory = project.file('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // tools/selftest.sh: functional checks on a fresh world, then the server stops
        selftest {
            server()
            programArgument '--nogui'
            systemProperty 'iceandfire.selftest', 'true'
        }
        // tools/stresstest.sh: generation, 30 dragons and 100 creatures, chunk reload cycles
        stress {
            server()
            programArgument '--nogui'
            systemProperty 'iceandfire.stress', 'true'
        }
        // tools/scenetest.sh: client scene with checks and screenshots in run/screenshots
        scene {
            client()
            systemProperty 'iceandfire.scene', 'true'
        }
        // tools/nettest.sh: a dedicated server in run-netserver and a client that joins it and rides a dragon
        netserver {
            server()
            gameDirectory = project.file('run-netserver')
            programArgument '--nogui'
            systemProperty 'iceandfire.nettest', 'server'
        }
        netclient {
            client()
            systemProperty 'iceandfire.nettest', 'client'
            programArguments.addAll '--quickPlayMultiplayer', 'localhost:25570', '--username', 'NetTester'
        }
        // the generated data into common/src/generated/resources (both loaders use them)
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', rootProject.file('common/src/generated/resources').absolutePath,
                    '--existing', rootProject.file('common/src/main/resources').absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.selftest)
        }
    }
}
neoForge.addModdingDependenciesTo(sourceSets.selftest)

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { url = 'https://maven.blamejared.com/' } // JEI
    mavenLocal() { content { includeGroup 'dev.vladeezyy.rampart' } } // Rampart: ./gradlew publishToMavenLocal there
}

dependencies {
    implementation "dev.vladeezyy.rampart:rampart-neoforge:${rampart_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

}

// neoforge.mods.toml comes from src/main/templates with the gradle properties
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_credits            : mod_credits,
            mod_issues             : mod_issues,
            rampart_version_range  : rampart_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// the port: see every compile error at once
tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xmaxerrs', '10000'] }
