# Build on every push and pull request, then the functional self-test (tools/selftest.sh) on a headless dev server.
# Rampart (Citadel's model and animation classes) comes from Maven Local in this build, so it is built first from
# Vladeezyy/rampart main. The jars and the self-test log are kept as artifacts.
name: Build

on:
  # branches only: a release tag (v2.1.13-beta.4+26.3) would build with the Rampart of main and fail
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'docs/**', 'licenses/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Vladeezyy/rampart
          ref: main
          path: rampart

      # java_version from gradle.properties (21 for 1.21.x, 25 for 26.x); org.gradle.java.home points at a JDK on
      # the dev Mac and does not exist here
      - name: Prepare gradle.properties
        id: props
        run: |
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties rampart/gradle.properties
          v=$(sed -n 's/^java_version=//p' gradle.properties | tr -d '[:space:]')
          if [ -z "$v" ]; then
            case "$(sed -n 's/^minecraft_version=//p' gradle.properties)" in 26*) v=25 ;; *) v=21 ;; esac
          fi
          echo "java=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.props.outputs.java }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Rampart into Maven Local
        run: cd rampart && chmod +x gradlew && ./gradlew publishToMavenLocal --console=plain

      - name: Build
        run: chmod +x gradlew && ./gradlew build --console=plain

      # tools/selftest.sh: the SelfTest checks on a fresh dev server world, "[selftest] DONE ok=N fail=0"
      - name: Self-test (NeoForge)
        run: |
          MAX_TICK_TIME=600000 bash tools/selftest.sh
          mv build-selftest.log selftest-neoforge.log
          grep -qE '\[selftest\] DONE ok=[0-9]+ fail=0' selftest-neoforge.log

      - name: Self-test (Fabric)
        run: |
          LOADER=fabric MAX_TICK_TIME=600000 bash tools/selftest.sh
          mv build-selftest.log selftest-fabric.log
          grep -qE '\[selftest\] DONE ok=[0-9]+ fail=0' selftest-fabric.log

      # tools/fuzztest.sh: every creature, item and block through bites, damage, clicks and riding, with Lithium
      - name: Bug hunt (Fabric, with Lithium)
        run: |
          status=0
          MAX_TICK_TIME=600000 bash tools/fuzztest.sh || status=$?
          mv build-selftest.log fuzz-fabric.log
          exit $status

      - name: Upload test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            selftest-*.log
            fuzz-*.log
          if-no-files-found: ignore

      - name: Upload jars
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            */build/libs/*.jar
            build/libs/*.jar
          if-no-files-found: ignore
